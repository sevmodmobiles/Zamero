name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon

      # Ключ подписи. Нужен один секрет ZAMERO_KEY_PASSWORD (любой пароль от 12 символов).
      # При первой сборке ключ создаётся сам, шифруется этим паролем и сохраняется
      # в репозитории как app/signing.keystore.enc. Без пароля файл бесполезен.
      - name: Signing key
        env:
          KEY_PASSWORD: ${{ secrets.ZAMERO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Секрет ZAMERO_KEY_PASSWORD не задан — APK подписан временным ключом, самообновление поверх не установится"
            exit 0
          fi
          ENC=app/signing.keystore.enc
          KS="$RUNNER_TEMP/zamero.keystore"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          # Ключ мог появиться в ветке после коммита этой сборки.
          git fetch -q origin "$BRANCH" || true
          if [ ! -f "$ENC" ] && git cat-file -e "origin/$BRANCH:$ENC" 2>/dev/null; then
            git show "origin/$BRANCH:$ENC" > "$ENC"
          fi
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:KEY_PASSWORD
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias zamero -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Zamero"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:KEY_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Ключ подписи (зашифрован)"
            git pull -q --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          else
            exit 0
          fi
          echo "ZAMERO_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ZAMERO_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Zamero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zamero-apk
          path: Zamero.apk

      - name: Release notes
        if: github.event_name != 'pull_request'
        run: git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D' > notes.txt

      # Каждая сборка — релиз v0.N. Приложение само проверяет последний релиз и обновляется.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Замеро 0.${{ github.run_number }}
          body_path: notes.txt
          files: Zamero.apk

      # Старый «плавающий» релиз из первых сборок больше не нужен.
      - name: Remove legacy "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true
